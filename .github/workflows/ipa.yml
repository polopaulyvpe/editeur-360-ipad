name: Fabriquer l'IPA
on:
  push:
  workflow_dispatch:

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ipa:
    # Les Mac Apple Silicon de GitHub sont souvent saturés : on compile sur un Mac Intel.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Outils
        run: brew install xcodegen
      - name: Projet Xcode
        run: xcodegen generate
      - name: "Compilation non signée (Sideloadly signera avec ton identifiant Apple)"
        run: |
          xcodebuild -project Editeur360.xcodeproj -scheme Editeur360 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/Editeur360.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
      - name: Paquet .ipa
        run: |
          mkdir -p Payload
          cp -R build/Editeur360.xcarchive/Products/Applications/Editeur360.app Payload/
          zip -qry Editeur360.ipa Payload
          ls -l Editeur360.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Editeur360-ipa
          path: Editeur360.ipa
          # Dépôt public : le .ipa n'est téléchargeable qu'un jour, le temps de le récupérer.
          retention-days: 1
